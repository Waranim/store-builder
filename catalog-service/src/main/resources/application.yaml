spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        order_updates: true
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC
        default_schema: catalog
        hbm2ddl:
          create_namespaces: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOSTNAME:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_NAME:store_builder}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

springdoc:
  server-url: ${GATEWAY_URL:http://localhost:8083/catalogs}
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    default-model-expand-depth: 3
    persistAuthorization: true
  api-docs:
    path: /v3/api-docs

server:
  port: 8083